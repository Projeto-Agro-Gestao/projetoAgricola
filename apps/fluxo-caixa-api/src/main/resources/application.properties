spring.application.name=fluxo-caixa-api


spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:fluxo_caixa}?allowPublicKeyRetrieval=true&useSSL=${DB_SSL:false}&sslMode=${DB_SSL_MODE:DISABLED}&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:${DB_USER:fluxo_caixa_app}}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.max-lifetime=1800000


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true


spring.flyway.enabled=true


app.seguranca.jwt.emissor=agrogestao-api
app.seguranca.jwt.destinatario=agrogestao-web
app.seguranca.jwt.expiracao-segundos=900
app.seguranca.jwt.segredo-base64=${JWT_SECRET_BASE64}


app.seguranca.cors.origem-web=${APP_WEB_ORIGINS:${APP_WEB_ORIGIN:http://localhost:5173}}


app.seguranca.recuperacao-senha.expiracao-minutos=30
app.seguranca.recuperacao-senha.url=${APP_RECUPERACAO_SENHA_URL:http://localhost:5173/redefinir-senha}


app.seguranca.refresh.expiracao-dias=7
app.seguranca.refresh.expiracao-dias-lembrar=30
app.seguranca.refresh.nome-cookie=agrogestao_refresh
app.seguranca.refresh.path=/api/v1/auth
app.seguranca.refresh.same-site=${APP_REFRESH_SAME_SITE:None}


google.oauth.client-id=${GOOGLE_CLIENT_ID:}

receita.cnpj.base-url=${RECEITA_CNPJ_BASE_URL:}
receita.cnpj.token=${RECEITA_CNPJ_TOKEN:}

official.cnpj.provider=${OFFICIAL_CNPJ_PROVIDER:DISABLED}
official.cnpj.cache-ttl=${OFFICIAL_CNPJ_CACHE_TTL:7d}
official.cnpj.base-url=${SERPRO_BASE_URL:}
official.cnpj.token-url=${SERPRO_TOKEN_URL:}
official.cnpj.consumer-key=${SERPRO_CONSUMER_KEY:}
official.cnpj.consumer-secret=${SERPRO_CONSUMER_SECRET:}
official.cnpj.certificate-path=${SERPRO_CERTIFICATE_PATH:}
official.cnpj.certificate-password=${SERPRO_CERTIFICATE_PASSWORD:}
official.cnpj.cnpj-path-template=${SERPRO_CNPJ_PATH_TEMPLATE:/v1/cnpj/{cnpj}}
official.tax-rules.sync-enabled=${TAX_RULE_SYNC_ENABLED:false}


spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:fluxocaixa@example.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_TIMEOUT:8000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:8000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_TIMEOUT:8000}


server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB


management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false


asaas.api-key=${ASAAS_API_KEY:}
asaas.base-url=${ASAAS_BASE_URL:}
asaas.environment=${ASAAS_ENVIRONMENT:}
asaas.webhook-token=${ASAAS_WEBHOOK_TOKEN:}
asaas.timeout-seconds=${ASAAS_TIMEOUT_SECONDS:10}
