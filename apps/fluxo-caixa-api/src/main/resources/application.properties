spring.application.name=fluxo-caixa-api


spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:fluxo_caixa}?allowPublicKeyRetrieval=true&useSSL=${DB_SSL:false}&sslMode=${DB_SSL_MODE:DISABLED}&serverTimezone=UTC
spring.datasource.username=${DB_USER:fluxo_caixa_app}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.max-lifetime=1800000


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true


spring.flyway.enabled=true


app.seguranca.jwt.emissor=agrogestao-api
app.seguranca.jwt.destinatario=agrogestao-web
app.seguranca.jwt.expiracao-segundos=900
app.seguranca.jwt.segredo-base64=${JWT_SECRET_BASE64}


app.seguranca.cors.origem-web=${APP_WEB_ORIGINS:${APP_WEB_ORIGIN:http://localhost:5173}}


app.seguranca.recuperacao-senha.expiracao-minutos=30
app.seguranca.recuperacao-senha.url=${APP_RECUPERACAO_SENHA_URL:http://localhost:5173/redefinir-senha}


spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:fluxocaixa@example.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_TIMEOUT:8000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:8000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_TIMEOUT:8000}


server.port=${PORT:8080}
server.forward-headers-strategy=framework


management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false