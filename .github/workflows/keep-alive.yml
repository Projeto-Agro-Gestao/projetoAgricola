name: Keep Alive Render

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      health_url:
        description: 'URL de health para manter o serviço ativo'
        required: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pingar backend (evita cold start)
        run: |
          URL="${HEALTH_URL}"
          echo "Ping em: $URL"
          curl -fsS \
            --max-time 120 \
            --retry 3 \
            --retry-delay 15 \
            --retry-all-errors \
            "$URL" \
            -w "\nHTTP %{http_code}\n"
        env:
          HEALTH_URL: >-
            ${{ inputs.health_url || vars.RENDER_HEALTH_URL || 'https://projetoagricola.onrender.com/actuator/health' }}
