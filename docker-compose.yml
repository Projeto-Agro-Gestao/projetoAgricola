services:
  mysql:
    image: mysql:8.0
    container_name: fluxo-caixa-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fluxo_caixa}
      MYSQL_USER: ${MYSQL_USER:-fluxo_caixa_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/fluxo-caixa-api
    container_name: fluxo-caixa-api
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${MYSQL_DATABASE:-fluxo_caixa}
      DB_USER: ${MYSQL_USER:-fluxo_caixa_app}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64}
      APP_WEB_ORIGIN: ${APP_WEB_ORIGIN:-http://localhost:5173}
      APP_RECUPERACAO_SENHA_URL: ${APP_RECUPERACAO_SENHA_URL:-http://localhost:5173/redefinir-senha}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && cat <&3 | grep -q 'UP'",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
